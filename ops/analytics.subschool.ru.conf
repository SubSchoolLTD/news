server {
    listen 80;
    server_name analytics.subschool.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name analytics.subschool.ru;
    ssl_certificate /etc/letsencrypt/live/analytics.subschool.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.subschool.ru/privkey.pem;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / {
        proxy_pass http://10.8.0.1;
        proxy_set_header Host analytics.subschool.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_cache off;
    }
}
