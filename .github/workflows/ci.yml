name: Verify SignalDesk
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: mkdir -p .local && python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --prefix frontend --registry=https://registry.npmjs.org
      - run: npm run build --prefix frontend
      - run: pip install -r backend/requirements.txt
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Browser end-to-end checks
        env:
          WORKER_ENABLED: "false"
          EMAIL_DELIVERY: disabled
          APP_ENV: test
          E2E_PYTHON: python3
        run: |
          mkdir -p .local
          PYTHONPATH=backend uvicorn app.main:app --host 127.0.0.1 --port 8010 --no-access-log > .local/e2e-api.log 2>&1 &
          npm run dev --prefix frontend > .local/e2e-vite.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8010/api/health
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5173/
          node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: output/playwright/
